name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/JobEngine.sln

      - name: Build
        run: dotnet build backend/JobEngine.sln --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test backend/tests/JobService.Tests --no-build --configuration Release --logger "trx;LogFileName=jobservice-results.trx"

      - name: Integration tests
        run: |
          dotnet test backend/tests/Integration.Tests --no-build --configuration Release --logger "trx;LogFileName=integration-results.trx"
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        with:
          name: Test Results
          path: '**/*-results.trx'
          reporter: dotnet-trx
